<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uptime Kuma Screen Monitor</title>
    <link href="modelo.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1 class="title">APLICAÇÕES FÁBRICA</h1>
      <span class="time">01/08/2024 22:35:46</span>
    </header>

    <div id="statistics">
      <h2>ESTATÍSITICAS</h2>
      <div class="statistics__content">
        <div class="statistic-card statistic-card--up"><span>87</span> <span>UP</span></div>
        <div class="statistic-card statistic-card--down">4 DOWN</div>
      </div>
    </div>

    <div id="down-services">
      <h2>Aplicações DOWN</h2>
      <div class="container">
        <div class="monitor monitor--down">
          <h4>mysapce-api</h4>
        </div>
        <div class="monitor monitor--down">
          <h4>myspace-frontend</h4>
        </div>
        <div class="monitor monitor--down">
          <h4>eive-api</h4>
        </div>
        <div class="monitor monitor--down">
          <h4>payagree-api</h4>
        </div>
      </div>
    </div>
    <footer>
      <p>Todos os diretiros reservados.</p>
    </footer>
  </body>
</html>
